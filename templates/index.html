<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Парсер Погоды</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>

        <section class="hero">
            <label for="city">Введите город:</label>
            <input id="city" type="text" name="city" placeholder="Введите город...">
            <button type="button" id="getWeather">Узнать погоду</button>
        </section>

        <section class="result"></section>

        <section class="history">
            <h2 class="history-title">История запросов</h2>
            <div class="history-content"></div>
        </section>
    </main>

    <script>
        const cityInput = document.getElementById('city');
        const resultDiv = document.querySelector('.result');
        const getWeatherBtn = document.getElementById('getWeather');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function fetchWeather() {
            const city = cityInput.value.trim();

            if (!city) {
                showError('Введите название города.');
                return;
            }

            resultDiv.innerHTML = '<p class="loading">Загрузка...</p>';

            fetch('/weather?city=' + encodeURIComponent(city))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) {
                        showError(data.error);
                        return;
                    }
                    renderWeatherCard(data);
                    loadHistory();
                })
                .catch(function() {
                    showError('Произошла ошибка соединения. Попробуйте позже.');
                });
        }

        function renderWeatherCard(data) {
            let html = '<div class="weather-card">';
            html += '<h2>' + escapeHtml(data.city) + '</h2>';
            html += '<div class="weather-temp">' + escapeHtml(String(data.temp)) + '<span>°C</span></div>';
            html += '<div class="weather-desc">' + escapeHtml(data.description) + '</div>';
            html += '<div class="weather-details">';
            html += '<div class="detail"><span class="detail-label">Влажность</span><span class="detail-value">' + escapeHtml(String(data.humidity)) + '%</span></div>';
            html += '<div class="detail"><span class="detail-label">Давление</span><span class="detail-value">' + escapeHtml(String(data.pressure)) + ' гПа</span></div>';
            html += '<div class="detail"><span class="detail-label">Ветер</span><span class="detail-value">' + escapeHtml(String(data.wind_speed)) + ' м/с</span></div>';
            html += '<div class="detail"><span class="detail-label">Состояние</span><span class="detail-value">' + escapeHtml(data.condition) + '</span></div>';
            html += '</div></div>';
            resultDiv.innerHTML = html;
        }

        function showError(message) {
            resultDiv.innerHTML = '<div class="error-box">' + escapeHtml(message) + '</div>';
        }


        function loadHistory() {
            fetch('/history?limit=10')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    const container = document.querySelector('.history-content');

                    if (data.length === 0) {
                        container.innerHTML = '<p class="empty">История пуста</p>';
                        return;
                    }

                    let html = '';
                    for (let i = 0; i < data.length; i++) {
                        const row = data[i];
                        html += '<div class="history-item">';
                        html += '<div class="history-city">' + escapeHtml(row.city) + '</div>';
                        html += '<div class="history-temp">' + escapeHtml(String(row.temp)) + '°C</div>';
                        html += '<div class="history-desc">' + escapeHtml(row.description) + '</div>';
                        html += '<div class="history-extra">' + escapeHtml(String(row.wind_speed)) + ' м/с · ' + escapeHtml(row.condition) + '</div>';
                        html += '<div class="history-date">' + escapeHtml(row.fetched_at) + '</div>';
                        html += '</div>';
                    }
                    container.innerHTML = html;
                });
        }


        getWeatherBtn.addEventListener('click', fetchWeather);

        cityInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fetchWeather();
        });

        loadHistory();
    </script>
</body>
</html>
